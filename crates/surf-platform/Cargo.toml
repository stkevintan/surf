[package]
name = "surf-platform"
description = "OS seams for Surf: shared memory, real-time threads, data directories"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media",
    # CreateFileMappingW takes an optional SECURITY_ATTRIBUTES.
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
