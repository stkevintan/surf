[package]
name = "surf-plugin"
description = "Surf plugin hosting: out-of-process client, protocol, shared memory, scanning"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Format adapters (VST3, VST2). Enabled by the host binary only, so the UI
# process never links plugin-loading code.
host = ["dep:vst3-host", "dep:vst"]

[dependencies]
surf-core.workspace = true
surf-audio.workspace = true
surf-platform.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
vst3-host = { workspace = true, optional = true }
vst = { workspace = true, optional = true }

# The VST2 editor's parent window is Win32 on Windows (other OSes have no
# VST2 editor yet).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
