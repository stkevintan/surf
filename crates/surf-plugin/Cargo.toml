[package]
name = "surf-plugin"
description = "Surf plugin hosting: out-of-process client, protocol, shared memory, scanning"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Format adapters (VST3, VST2). Enabled by the host binary only, so the UI
# process never links plugin-loading code.
host = ["dep:vst3-host", "dep:vst"]

[dependencies]
surf-core.workspace = true
surf-audio.workspace = true
surf-platform.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
vst3-host = { workspace = true, optional = true }

# VST2 hosting is Windows-only (the only VST2 targets in practice).
[target.'cfg(windows)'.dependencies]
vst = { workspace = true, optional = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
# Declared so the `host` feature resolves on every OS; unused off Windows.
vst = { workspace = true, optional = true }
